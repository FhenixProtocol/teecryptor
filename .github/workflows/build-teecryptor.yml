name: build-teecryptor

# Builds a NATIVE multi-arch image (no QEMU) and pushes it to the shared
# Artifact Registry (project fhenix-artifacts-registry). amd64 is what the Confidential Space
# TDX VM runs; arm64 lets devs pull/run locally on Apple Silicon. Built ONCE — every
# environment's VM pulls the same digest from the artifact registry and pins it in its
# own keys-side CEL.
#
# Two publish paths, selected by the `testing` dispatch input:
# - Production (push to main, or a dispatch with testing=false): WIF auth via the
#   NON-SECRET repo variables WIF_PROVIDER, PUBLISHER_SA and IMAGE_REGISTRY. The WIF
#   provider pins the ref, so only main can publish here. Tags :latest.
# - Testing (a dispatch with testing=true, the default): the GCP_AR_TESTING_SA key
#   secret and the TESTING_IMAGE_REGISTRY variable. Any branch can build. Pushes to
#   the isolated teecryptor-testing repository and never tags :latest.
#
# BUILDING IS NOT DEPLOYING: a VM only runs the digest pinned in its keys-side CEL,
# which stays a manual two-phase terraform step (see Makefile `deploy`, set
# KEYS_PROJECT + COMPUTE_PROJECT).
#
# A production build signs the amd64 digest with keyless Cosign and attests SLSA
# build provenance. Both use this workflow's OIDC token. Both go to the public
# Rekor log. No signing key exists. A partner checks the signature at PIN time,
# before it approves a digest. The runtime gate does not change: the CEL still
# pins the digest only.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Image tag (e.g. v0.1.0). Defaults to <branch>-<sha> when omitted."
        required: false
        default: ""
      testing:
        description: "Push to the isolated testing registry with the testing SA key (no WIF, no :latest). Set false for a production build from main."
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "src/**"
      - "abi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".github/workflows/build-teecryptor.yml"

permissions:
  contents: read
  id-token: write # GCP WIF (OIDC token exchange), and Fulcio for keyless Cosign
  attestations: write # SLSA build provenance

env:
  # Push events carry no inputs, so `inputs.testing` is empty there and both values
  # resolve to the production path.
  TESTING: ${{ inputs.testing == true }}
  IMAGE_REGISTRY: ${{ inputs.testing == true && vars.TESTING_IMAGE_REGISTRY || vars.IMAGE_REGISTRY }}

jobs:
  # Gate: the image is only built if the suite passes.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # --release for the same reason as ci.yml: unoptimised tfhe makes this suite
      # ~11x slower, and the cache above pays the optimised compile once.
      - name: Test
        run: cargo test --release --all-targets

  # One leg per architecture on its NATIVE runner. Each pushes by digest (untagged)
  # into the selected registry; merge stitches them into one multi-arch manifest.
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Platform pair
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Auth to GCP (WIF, production registry)
        if: inputs.testing != true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
          # Match the provider's allowed_audiences (GCP no-scheme URI form).
          audience: //iam.googleapis.com/${{ vars.WIF_PROVIDER }}
      - name: Auth to GCP (SA key, testing registry)
        if: inputs.testing == true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_AR_TESTING_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${IMAGE_REGISTRY%%/*}" --quiet

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Build + push (${{ matrix.platform }}, by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_REGISTRY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${PLATFORM_PAIR}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest in the selected registry,
  # tag it, and surface the amd64 PLATFORM digest (what the TDX VM runs).
  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Needed so the Trivy step below can read .trivyignore from the working tree —
      # this job otherwise only stitches the manifest and scans a remote image by ref.
      - uses: actions/checkout@v4
      - name: Auth to GCP (WIF, production registry)
        if: inputs.testing != true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
          audience: //iam.googleapis.com/${{ vars.WIF_PROVIDER }}
      - name: Auth to GCP (SA key, testing registry)
        if: inputs.testing == true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_AR_TESTING_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${IMAGE_REGISTRY%%/*}" --quiet
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ github.run_id }}
          merge-multiple: true

      - name: Create + push multi-arch manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd "${{ runner.temp }}/digests"
          # workflow_dispatch may supply a tag; otherwise it's <branch>-<short sha>,
          # which is main-<short sha> on a push to main.
          DEFAULT_TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          TAG="${RELEASE_TAG:-${DEFAULT_TAG}}"
          refs=()
          for f in *; do refs+=("${IMAGE_REGISTRY}@$(cat "$f")"); done
          tags=(-t "${IMAGE_REGISTRY}:${TAG}")
          # :latest tracks the production repository only. A testing build never moves it.
          if [[ "${TESTING}" != "true" ]]; then
            tags+=(-t "${IMAGE_REGISTRY}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # The TDX VM runs amd64, so each env's keys-side CEL must pin the AMD64
          # PLATFORM digest — NOT the manifest-list digest (the VM would never match
          # it and refuse to boot).
          echo "amd64_digest=$(cat linux-amd64)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (amd64 — the image the TDX VM runs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}@${{ steps.manifest.outputs.amd64_digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Explicit, auditable exceptions live in .trivyignore (each entry justified
          # + carries a revisit trigger). The gate stays strict for everything else.
          trivyignores: .trivyignore

      # These two actions are pinned by SHA, unlike the rest of this file. A
      # moved tag on either one forges provenance for every image we ship.
      - name: Install Cosign
        if: inputs.testing != true
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Cosign gets a certificate from Fulcio with this job's OIDC token. The
      # certificate names the repo, the workflow, the ref and the commit. The
      # partner asserts those four fields at pin time.
      #
      # It signs the AMD64 PLATFORM digest. That is the digest each partner pins
      # and the digest the TDX VM runs. A signature on the manifest-list digest
      # would never match a pin.
      #
      # Cosign stores the signature next to the image, under the tag
      # sha256-<digest>.sig. This registry grants allUsers the reader role, so a
      # partner reads that signature with no credential. That public read is
      # DELIBERATE and the partner check depends on it. Do not remove it.
      #
      # A testing build never signs. Its registry is not public, and it can run
      # from any branch, so the certificate would carry a ref that no partner
      # accepts.
      - name: Sign the amd64 image with keyless Cosign
        if: inputs.testing != true
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REGISTRY}@${AMD64_DIGEST}"

      # The same identity attests the same digest in the standard SLSA format.
      # The partner verify command reads the Cosign signature above. This
      # attestation serves any other consumer.
      - name: Attest SLSA build provenance
        if: inputs.testing != true
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}
          subject-digest: ${{ steps.manifest.outputs.amd64_digest }}
          push-to-registry: true

      - name: Print digest for the two-phase deploy
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          # workflow_ref is "<owner>/<repo>/<path>@<ref>". Add the server URL and
          # it equals the Fulcio certificate identity.
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          {
            if [[ "${TESTING}" == "true" ]]; then
              echo "TESTING build pushed to the isolated testing repository: ${IMAGE_REGISTRY}:${TAG}  (no :latest)"
              echo
              echo "A pin on this image is temporary: re-pin to the production repository after the branch merges."
              echo "The VM runtime SA needs roles/artifactregistry.reader on the testing repository to pull it."
            else
              echo "Image pushed to the shared artifact registry: ${IMAGE_REGISTRY}:${TAG}  (+ :latest)"
            fi
            echo
            echo "PIN THIS (amd64 platform digest) per env in the gitops var-file AND in each"
            echo "partner's attested_readers (keygen repo):"
            echo "    ${IMAGE_REGISTRY}@${AMD64_DIGEST}"
            echo
            echo "Then per env, from a gitops checkout — apply, then roll:"
            echo "    terraform -chdir=compute apply -var-file=<gitops>/terraform/<env>/teecryptor/<env>.tfvars"
            echo "    gcloud compute instance-groups managed rolling-action replace teecryptor-mig \\"
            echo "      --zone=<zone> --project=<env-compute-project> --max-surge=1 --max-unavailable=0"
            echo
            echo "The apply alone deploys nothing: update_policy is OPPORTUNISTIC, so it only re-points"
            echo "the template. The replace is what recreates the VM, which is what re-attests it."
            if [[ "${TESTING}" != "true" ]]; then
              echo
              echo "## Hand these two values to each partner"
              echo
              echo '```hcl'
              echo "image_digest = \"${AMD64_DIGEST}\""
              echo "source_sha   = \"${COMMIT}\""
              echo '```'
              echo
              echo "That is the whole handoff. The partner tooling holds the rest"
              echo "as fixed constants."
              echo
              echo "## Verify this image against the public Rekor log"
              echo
              echo "The partner runs this on their own machine. It proves that this"
              echo "workflow built this digest from this commit. A non-zero exit means:"
              echo "do not pin."
              echo
              echo '```'
              echo "cosign verify ${IMAGE_REGISTRY}@${AMD64_DIGEST} \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
              echo "  --certificate-identity ${IDENTITY} \\"
              echo "  --certificate-github-workflow-repository ${REPO} \\"
              echo "  --certificate-github-workflow-ref ${REF} \\"
              echo "  --certificate-github-workflow-sha ${COMMIT}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
